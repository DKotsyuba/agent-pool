name: release
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Select release targets explicitly
        required: true
        type: choice
        default: select-targets
        options: [select-targets, paired, linux-only]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated version tag at the dispatched source
        shell: bash
        env:
          RELEASE_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$RELEASE_TARGETS" == paired || "$RELEASE_TARGETS" == linux-only ]]
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "$GITHUB_REF^{}")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
  check:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.targets == 'paired'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: product-check-v2-macos-26-${{ runner.arch }}
          cache-bin: false
          save-if: false
      - run: cargo fetch --locked
      - name: Install cargo-nextest 0.9.149 from the checksum-verified release archive
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.149/cargo-nextest-0.9.149-universal-apple-darwin.tar.gz
          echo "47b9941765a9ff94e304a3fe5444ac1c7593da655525b8b69f8f2b31a9217507  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin"
      - run: cargo xtask check
  # Build independently of the source gate; publication requires both to pass.
  build:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.targets == 'paired'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: product-package-v1-macos-26-${{ runner.arch }}
          cache-bin: false
          save-if: false
      - run: cargo fetch --locked
      - name: Build the exact payload once
        shell: bash
        run: |
          bundle=$(cargo xtask package | tail -n 1)
          cargo xtask package verify "$bundle"
          mkdir "$RUNNER_TEMP/upload"
          cp "$bundle/"* "$RUNNER_TEMP/upload/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload
          path: ${{ runner.temp }}/upload/
          if-no-files-found: error
          retention-days: 7
  check-linux:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(uname -s):$(uname -m)" = Linux:x86_64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: product-check-v1-ubuntu-24.04-${{ runner.arch }}
          cache-bin: false
          save-if: false
      - run: cargo fetch --locked
      - name: Install cargo-nextest 0.9.149 from the checksum-verified release archive
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.149/cargo-nextest-0.9.149-x86_64-unknown-linux-gnu.tar.gz
          echo "32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770  $RUNNER_TEMP/nextest.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin"
      - run: cargo xtask check
  build-linux:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      binary_sha256: ${{ steps.pin.outputs.binary_sha256 }}
      manifest_sha256: ${{ steps.pin.outputs.manifest_sha256 }}
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(uname -s):$(uname -m)" = Linux:x86_64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: product-package-v1-ubuntu-24.04-${{ runner.arch }}
          cache-bin: false
          save-if: false
      - run: cargo fetch --locked
      - name: Build and pin the exact Linux payload
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          clean=(env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STATE -u GITHUB_STEP_SUMMARY)
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          "${clean[@]}" cargo xtask package --out "$RUNNER_TEMP/linux-payload"
          "${clean[@]}" cargo test --frozen --package agent-pool --test it --no-run --message-format=json > "$RUNNER_TEMP/protocol-artifacts.json"
          protocol=$(jq -ser --arg source "$GITHUB_WORKSPACE/tests/it/main.rs" '[.[] | select(.reason == "compiler-artifact" and .target.name == "it" and .target.src_path == $source and .profile.test == true and (.target.kind | index("test")) != null and .executable != null)] | if length == 1 then .[0].executable else error("ambiguous protocol test") end' "$RUNNER_TEMP/protocol-artifacts.json")
          [[ "$protocol" == /* && "$protocol" != *$'\n'* && -x "$protocol" ]]
          "${clean[@]}" cargo xtask package verify "$RUNNER_TEMP/linux-payload"
          dirty=$(git status --porcelain)
          test -z "$dirty"
          head=$(git rev-parse HEAD)
          test "$head" = "$GITHUB_SHA"
          binary="$RUNNER_TEMP/linux-payload/agent-pool-x86_64-unknown-linux-gnu"
          manifest="$RUNNER_TEMP/linux-payload/release-manifest.json"
          binary_sha=$(sha256sum "$binary" | awk '{print $1}')
          manifest_sha=$(sha256sum "$manifest" | awk '{print $1}')
          protocol_sha=$(sha256sum "$protocol" | awk '{print $1}')
          printf 'binary_sha256=%s\nmanifest_sha256=%s\nprotocol_path=%s\nprotocol_sha256=%s\n' "$binary_sha" "$manifest_sha" "$protocol" "$protocol_sha" >> "$GITHUB_OUTPUT"
      - name: Accept the pinned Linux payload
        shell: bash
        env:
          EXPECTED_BINARY_SHA256: ${{ steps.pin.outputs.binary_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.pin.outputs.manifest_sha256 }}
          EXPECTED_PROTOCOL_SHA256: ${{ steps.pin.outputs.protocol_sha256 }}
          PROTOCOL_TEST: ${{ steps.pin.outputs.protocol_path }}
        run: |
          set -euo pipefail
          clean=(env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STATE -u GITHUB_STEP_SUMMARY)
          binary="$RUNNER_TEMP/linux-payload/agent-pool-x86_64-unknown-linux-gnu"
          manifest="$RUNNER_TEMP/linux-payload/release-manifest.json"
          test "$(sha256sum "$binary" | awk '{print $1}')" = "$EXPECTED_BINARY_SHA256"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum "$PROTOCOL_TEST" | awk '{print $1}')" = "$EXPECTED_PROTOCOL_SHA256"
          package_id=$("${clean[@]}" cargo pkgid --frozen --package agent-pool)
          version=${package_id##*#}
          version=${version##*@}
          actual_version=$("${clean[@]}" "$binary" --version)
          test "$actual_version" = "agent-pool $version"
          readiness=$("${clean[@]}" "$binary" contract readiness)
          test "$(printf '%s' "$readiness" | tr -d '[:space:]')" = '[]'
          dirty=$(git status --porcelain)
          test -z "$dirty"
          head=$(git rev-parse HEAD)
          test "$head" = "$GITHUB_SHA"
          test "$(sha256sum "$PROTOCOL_TEST" | awk '{print $1}')" = "$EXPECTED_PROTOCOL_SHA256"
          test "$("${clean[@]}" "$PROTOCOL_TEST" --list protocol:: | grep -c ': test$')" -gt 0
          MCP_TEST_BINARY="$binary" "${clean[@]}" "$PROTOCOL_TEST" protocol::
          "${clean[@]}" cargo xtask package verify "$RUNNER_TEMP/linux-payload"
          test "$(sha256sum "$binary" | awk '{print $1}')" = "$EXPECTED_BINARY_SHA256"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum "$PROTOCOL_TEST" | awk '{print $1}')" = "$EXPECTED_PROTOCOL_SHA256"
          dirty=$(git status --porcelain)
          test -z "$dirty"
          head=$(git rev-parse HEAD)
          test "$head" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload-linux
          path: ${{ runner.temp }}/linux-payload/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [validate, check, build, check-linux, build-linux]
    if: github.event_name == 'workflow_dispatch' && inputs.targets == 'paired'
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    environment: release
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: product-check-v2-macos-26-${{ runner.arch }}
          cache-bin: false
          save-if: false
      - name: Restore native cargo-deny
        id: cargo-deny-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-macos-26-0.20.2-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payload
          path: ${{ runner.temp }}/payload
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payload-linux
          path: ${{ runner.temp }}/payload-linux
      - name: Build only tooling, without release credentials in its environment
        run: |
          cargo fetch --locked
          cargo build --frozen -p xtask
          if [ "$(cargo deny --version 2>/dev/null)" != 'cargo-deny 0.20.2' ]; then
            cargo install cargo-deny --version 0.20.2 --locked --force
          fi
          test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
      - name: Save native cargo-deny
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') && steps.cargo-deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.cargo-deny-cache.outputs.cache-primary-key }}
      - name: Verify hashes before giving the payload executable permissions
        shell: bash
        run: |
          target/debug/xtask package verify "$RUNNER_TEMP/payload"
          target/debug/xtask package verify "$RUNNER_TEMP/payload-linux"
          find "$RUNNER_TEMP/payload" -type f ! -name release-manifest.json -exec chmod 755 {} \;
      - name: Test the shipped payload, publish a complete draft, then make it visible
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_POOL_LINUX_BINARY_SHA256: ${{ needs.build-linux.outputs.binary_sha256 }}
          AGENT_POOL_LINUX_MANIFEST_SHA256: ${{ needs.build-linux.outputs.manifest_sha256 }}
        run: target/debug/xtask release publish "$RUNNER_TEMP/payload" --linux-directory "$RUNNER_TEMP/payload-linux"
      # Publishing additionally refuses release.enabled=false, unqualified targets/hosts and stubs.
      # Configure required reviewers on the release environment; creating this file alone does not do it.
  publish-linux:
    needs: [validate, check-linux, build-linux]
    if: github.event_name == 'workflow_dispatch' && inputs.targets == 'linux-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    environment: release
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(uname -s):$(uname -m)" = Linux:x86_64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: product-check-v1-ubuntu-24.04-${{ runner.arch }}
          cache-bin: false
          save-if: false
      - name: Restore native cargo-deny
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-0.20.2-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payload-linux
          path: ${{ runner.temp }}/payload-linux
      - name: Build only tooling, without release credentials in its environment
        run: |
          cargo fetch --locked
          cargo build --frozen -p xtask
          if [ "$(cargo deny --version 2>/dev/null)" != 'cargo-deny 0.20.2' ]; then
            cargo install cargo-deny --version 0.20.2 --locked --force
          fi
          test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
      - name: Verify hashes before giving the payload executable permissions
        shell: bash
        run: |
          target/debug/xtask package verify "$RUNNER_TEMP/payload-linux"
          find "$RUNNER_TEMP/payload-linux" -type f ! -name release-manifest.json -exec chmod 755 {} \;
      - name: Test the shipped payload, publish a complete draft, then make it visible
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_POOL_LINUX_BINARY_SHA256: ${{ needs.build-linux.outputs.binary_sha256 }}
          AGENT_POOL_LINUX_MANIFEST_SHA256: ${{ needs.build-linux.outputs.manifest_sha256 }}
        run: target/debug/xtask release publish "$RUNNER_TEMP/payload-linux" --linux-only
