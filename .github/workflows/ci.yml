name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: product-check-v2-macos-26-${{ runner.arch }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - name: Install cargo-nextest 0.9.149 from the checksum-verified release archive
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.149/cargo-nextest-0.9.149-universal-apple-darwin.tar.gz
          echo "47b9941765a9ff94e304a3fe5444ac1c7593da655525b8b69f8f2b31a9217507  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest-bin"
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"
      - run: cargo xtask check
      # Main warms native publisher tooling; PRs never compile this unused tool.
      - name: Restore native cargo-deny
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: cargo-deny-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-macos-26-0.20.2-${{ hashFiles('rust-toolchain.toml') }}
      - name: Prepare verified native cargo-deny
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ "$(cargo deny --version 2>/dev/null)" != 'cargo-deny 0.20.2' ]; then
            cargo install cargo-deny --version 0.20.2 --locked --force
          fi
          test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
      - name: Save native cargo-deny
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.cargo-deny-cache.outputs.cache-primary-key }}
  check-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test "$(uname -s):$(uname -m)" = Linux:x86_64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: product-check-v1-ubuntu-24.04-${{ runner.arch }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - name: Install cargo-nextest 0.9.149 from the checksum-verified release archive
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.149/cargo-nextest-0.9.149-x86_64-unknown-linux-gnu.tar.gz
          echo "32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770  $RUNNER_TEMP/nextest.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest-bin"
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"
      - run: cargo xtask check
  # Main and manual runs retain a native macOS candidate without publishing a release.
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: product-package-v1-macos-26-${{ runner.arch }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - name: Build and verify the archived native candidate
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV | grep -Fx 'host: aarch64-apple-darwin'
          cargo xtask package --out "$RUNNER_TEMP/macos-payload"
          tar -C "$RUNNER_TEMP/macos-payload" -czf "$RUNNER_TEMP/macos-payload.tar.gz" .
          mkdir "$RUNNER_TEMP/macos-inspect"
          tar -C "$RUNNER_TEMP/macos-inspect" -xzf "$RUNNER_TEMP/macos-payload.tar.gz"
          cargo xtask package verify "$RUNNER_TEMP/macos-inspect"
          package_id=$(cargo pkgid --frozen --package agent-pool)
          version=${package_id##*#}
          version=${version##*@}
          actual_version=$("$RUNNER_TEMP/macos-inspect/agent-pool-aarch64-apple-darwin" --version)
          test "$actual_version" = "agent-pool $version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-macos-aarch64
          path: ${{ runner.temp }}/macos-payload.tar.gz
          if-no-files-found: error
          retention-days: 7
  package-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test "$(uname -s):$(uname -m)" = Linux:x86_64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: product-package-v1-ubuntu-24.04-${{ runner.arch }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - name: Build and verify the archived native candidate
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV | grep -Fx 'host: x86_64-unknown-linux-gnu'
          cargo xtask package --out "$RUNNER_TEMP/linux-payload"
          tar -C "$RUNNER_TEMP/linux-payload" -czf "$RUNNER_TEMP/linux-payload.tar.gz" .
          mkdir "$RUNNER_TEMP/linux-inspect"
          tar -C "$RUNNER_TEMP/linux-inspect" -xzf "$RUNNER_TEMP/linux-payload.tar.gz"
          cargo xtask package verify "$RUNNER_TEMP/linux-inspect"
          package_id=$(cargo pkgid --frozen --package agent-pool)
          version=${package_id##*#}
          version=${version##*@}
          actual_version=$("$RUNNER_TEMP/linux-inspect/agent-pool-x86_64-unknown-linux-gnu" --version)
          test "$actual_version" = "agent-pool $version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-linux-x86_64
          path: ${{ runner.temp }}/linux-payload.tar.gz
          if-no-files-found: error
          retention-days: 7
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set runner temporary directory
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-0.20.2-${{ hashFiles('rust-toolchain.toml') }}
      - name: Prepare verified cargo-deny
        shell: bash
        run: |
          if [ "$(cargo deny --version 2>/dev/null)" != 'cargo-deny 0.20.2' ]; then
            cargo install cargo-deny --version 0.20.2 --locked --force
          fi
          test "$(cargo deny --version)" = 'cargo-deny 0.20.2'
      - run: cargo deny --locked check
      - name: Save cargo-deny
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-deny-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.cargo-deny-cache.outputs.cache-primary-key }}
