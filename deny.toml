# Reviewed baseline allowlist, not an assertion that every future dependency is acceptable.
# Advisory ignores below are owner-approved, dated and time-boxed; each must be re-checked or removed by its stated date.
[advisories]
yanked = "deny"
ignore = [
    # Owner approved 2026-11-18.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (informational, no vulnerability); required by rmcp; re-check by 2027-02-01" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; allowed only because every crate is publish = false.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared Bridge SDK is pinned to an exact reviewed commit in Cargo.toml/Cargo.lock.
allow-git = ["https://github.com/DKotsyuba/agent-bridge"]
