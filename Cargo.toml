[workspace]
members = ["crates/mcp-presentation", "crates/family-delivery", "xtask"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
minijinja = { version = "=2.24.0", default-features = false, features = ["serde", "fuel"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "raw_value"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "sync", "signal", "time", "process"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
uuid = { version = "=1.26.1", features = ["v4"] }
# Agent Bridge v0.7.0 (tag v0.7.0); pinned by rev for immutability.
bridge-sdk = { git = "https://github.com/DKotsyuba/agent-bridge.git", rev = "c12376fe8a89fd18dd4bb21e0c55aec1308e1e5f" }
sha2 = "0.10"
fs2 = "0.4"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
zeroize = "=1.9.0"
toml = "0.8"
semver = "1"
tempfile = "3"

[package]
name = "agent-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono.workspace = true
clap.workspace = true
mcp-presentation = { path = "crates/mcp-presentation" }
family-delivery = { path = "crates/family-delivery" }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
minijinja.workspace = true
tokio.workspace = true
toml.workspace = true
rusqlite.workspace = true
uuid.workspace = true
sha2.workspace = true
fs2.workspace = true
ed25519-dalek.workspace = true
zeroize.workspace = true
bridge-sdk.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
